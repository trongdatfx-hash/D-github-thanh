<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>SPY Positioning &amp; Range Console</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#07101d;color:#e9eef7;font:13px/1.5 -apple-system,Segoe UI,Arial,sans-serif}
  header{padding:16px 24px;background:#0b1728;border-bottom:1px solid #24364d;position:sticky;top:0;z-index:10;
         display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:20px}
  h2{font-size:15px;margin:0 0 10px}
  main{max-width:1400px;margin:auto;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#0d1929;border:1px solid #23364e;border-radius:12px;padding:14px;margin-bottom:12px}
  .metric{font-size:24px;font-weight:800;line-height:1.25}
  .green{color:#39d18c}.red{color:#ff6976}.yellow{color:#f0c45d}.blue{color:#6ea8ff}
  .muted,.small{color:#91a4be;font-size:11px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  button,textarea,select,input{background:#0a1524;color:#eee;border:1px solid #2b405b;border-radius:7px;padding:8px 10px;font:inherit}
  button{cursor:pointer}
  button:hover{border-color:#4a7ab8}
  .primary{background:#347cf6;border-color:#347cf6}
  .primary:hover{background:#4a8bf8}
  table{width:100%;border-collapse:collapse}
  td,th{padding:6px 7px;border-bottom:1px solid #23364e;text-align:right}
  td:first-child,th:first-child{text-align:left}
  th{color:#91a4be;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  canvas{width:100%;background:#091321;border-radius:8px;display:block}
  #chart{height:320px}
  #fcChart{height:260px}
  .bar{height:12px;background:#18283c;border-radius:10px;overflow:hidden;margin:8px 0}
  .bar i{display:block;height:100%;background:#347cf6}
  .gauge{height:8px;background:#18283c;border-radius:10px;position:relative;margin:6px 0 2px}
  .gauge i{position:absolute;top:-3px;width:3px;height:14px;background:#fff;border-radius:2px}
  .gauge b{position:absolute;top:0;height:8px;background:#347cf6;border-radius:10px;opacity:.5}
  textarea{width:100%;min-height:90px;font:12px monospace}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;border:1px solid #2b405b;margin-right:6px}
  .ok{color:#39d18c;border-color:#1f5c42}
  .bad{color:#ff6976;border-color:#6b2730}
  .warn{background:#2a1f0d;border:1px solid #6b5320;color:#f0c45d;padding:9px 12px;border-radius:8px;margin-bottom:10px;font-size:12px;line-height:1.6}
  .err{background:#2a1114;border:1px solid #6b2730;color:#ff9aa4;padding:9px 12px;border-radius:8px;margin-bottom:10px;font-size:12px;line-height:1.6}
  .vpn{background:#0e2237;border:1px solid #2f5680;color:#bcd6f5;padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.7;margin-bottom:10px}
  details summary{cursor:pointer;color:#91a4be;font-size:12px}
  a{color:#6ea8ff}
  @media(max-width:900px){.grid,.two{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.grid,.two{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div>
    <h1><span data-i18n="app.title"></span> <span class="muted">v5</span></h1>
    <div class="muted" data-i18n="app.tagline"></div>
  </div>
  <select id="lang" title="Language / Ngôn ngữ" style="min-width:130px">
    <option value="vi">🇻🇳 Tiếng Việt</option>
    <option value="en">🇬🇧 English</option>
  </select>
</header>

<main>
  <div class="controls">
    <button class="primary" id="reload"></button>
    <select id="contract" title="Contract"></select>
    <select id="mode"></select>
    <select id="lookback"></select>
    <select id="tf"></select>
    <span id="status" class="muted" data-i18n="st.boot"></span>
  </div>

  <div id="alerts"></div>
  <div class="grid" id="top"></div>

  <div class="two">
    <div class="card"><h2 data-i18n="card.index"></h2><div id="idxTable"></div>
      <div class="small" style="margin-top:8px" data-i18n="card.index.note"></div>
    </div>
    <div class="card"><h2 data-i18n="card.net"></h2><div id="netTable"></div></div>
  </div>

  <div class="card"><h2 data-i18n="card.signal"></h2><div id="signal"></div></div>

  <div class="card"><h2 data-i18n="card.spy"></h2><div id="spyStats"></div><canvas id="chart"></canvas>
    <div class="small" id="chartNote" style="margin-top:6px"></div>
    <div id="wrbInfo" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2 id="fcTitle"></h2>
    <div class="small" id="fcSub" style="margin:-4px 0 8px"></div>
    <div id="fcLegend" style="margin-bottom:8px"></div>
    <canvas id="fcChart"></canvas>
    <div class="small" id="fcNote" style="margin-top:6px"></div>
  </div>

  <div class="two">
    <div class="card"><h2 data-i18n="card.prob"></h2><div id="prob"></div></div>
    <div class="card"><h2 data-i18n="card.matrix"></h2><div id="matrix"></div></div>
  </div>

  <div class="card">
    <h2 data-i18n="card.diag"></h2>
    <div id="diag"></div>
  </div>

  <div class="card">
    <h2 data-i18n="card.blocked"></h2>
    <div class="vpn">
      <b data-i18n="blk.vpnTitle"></b><br>
      <span data-i18n-html="blk.vpnBody"></span>
    </div>
    <div class="small" style="line-height:1.7" data-i18n-html="blk.step1"></div>
    <div class="controls" style="margin-top:8px">
      <button id="openInTab" data-i18n="blk.openTab"></button>
    </div>
    <div class="small" style="line-height:1.7;margin-top:10px" data-i18n-html="blk.step2"></div>
    <div class="controls" style="margin-top:8px">
      <input id="sourceUrl" type="url" data-i18n-ph="blk.srcPlaceholder" style="flex:1;min-width:280px">
      <button id="saveSource" data-i18n="blk.saveSrc"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="card.token"></h2>
    <div class="small"><span data-i18n="tok.help"></span>
      <a href="https://evergreen.data.socrata.com/signup" target="_blank" rel="noopener">evergreen.data.socrata.com/signup</a>.</div>
    <div class="controls" style="margin-top:8px">
      <input id="token" type="password" data-i18n-ph="tok.placeholder" style="flex:1;min-width:240px">
      <button id="saveToken" data-i18n="tok.save"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="card.import"></h2>
    <div class="small" style="line-height:1.7" data-i18n-html="imp.help"></div>
    <textarea id="manual" placeholder='[{"report_date_as_yyyy_mm_dd":"2026-08-25T00:00:00.000","lev_money_positions_long":"150526", …}, …]'></textarea>
    <div class="controls" style="margin-top:8px">
      <button id="apply" data-i18n="imp.apply"></button>
      <input id="file" type="file" accept=".json,application/json" style="font:inherit;color:#91a4be;border:0;padding:0">
      <button id="clearImport" data-i18n="imp.clear"></button>
      <span id="importState" class="small"></span>
    </div>
  </div>

  <div class="small" style="padding:8px 0 30px" data-i18n="foot.note"></div>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
