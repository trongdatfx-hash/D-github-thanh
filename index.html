<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPYUSDT.P — Taker Buy/Sell Live</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#171a21;color:#d7dde7;font-family:Arial,sans-serif}
body{overflow:hidden;min-width:320px}
#top{height:58px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid #292e38;background:#171a21}
.title{font-size:16px;font-weight:700}.sub{font-size:11px;color:#7f899a;margin-top:2px}
select,button{background:#20242d;color:#d7dde7;border:1px solid #39414e;border-radius:5px;padding:7px 9px;font-size:12px}
button{cursor:pointer}button:hover{border-color:#657183}
#status{margin-left:auto;font-size:11px}.ok{color:#2ebd85}.bad{color:#f6465d}
#wrap{position:absolute;left:0;right:0;top:58px;bottom:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;max-width:600px;background:#20242d;border:1px solid #f6465d;color:#e7e9ee;border-radius:7px;padding:16px;line-height:1.5;z-index:4}
#tip{position:absolute;display:none;pointer-events:none;background:rgba(24,28,36,.97);border:1px solid #424a57;border-radius:5px;padding:8px 10px;font-size:11px;line-height:1.55;z-index:5}
</style>
</head>
<body>
<div id="top">
 <div><div class="title">SPYUSDT.P — Price + Taker Buy/Sell Volume</div><div class="sub">Binance USDⓈ-M Futures · live</div></div>
 <select id="tf"><option value="1m">1m</option><option value="5m">5m</option><option value="15m" selected>15m</option><option value="30m">30m</option><option value="1h">1h</option><option value="2h">2h</option><option value="4h">4h</option><option value="1d">1D</option></select>
 <select id="range"><option value="1">1D</option><option value="3">3D</option><option value="7" selected>7D</option><option value="14">14D</option><option value="30">30D</option></select>
 <button id="left">◀</button><button id="right">▶</button><button id="fit">Fit</button><button id="refresh">↻ Reload</button>
 <span style="font-size:11px;color:#7f899a">Wheel=zoom · Drag=pan</span>
 <div id="status" class="bad">Loading…</div>
</div>
<div id="wrap"><canvas id="c"></canvas><div id="tip"></div><div id="err"></div></div>
<script src="app.js"></script>
</body>
</html>
