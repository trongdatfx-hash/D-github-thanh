name: NetFlow RTH Lite Forex Factory calendar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'netflow-rth-lite/scripts/update-forex-calendar.mjs'
      - 'netflow-rth-lite/forex-calendar.mjs'
      - '.github/workflows/netflow-rth-lite-calendar.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: netflow-rth-lite-calendar-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official Forex Factory week
        run: node netflow-rth-lite/scripts/update-forex-calendar.mjs
      - name: Save calendar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netflow-rth-lite/data/forex-calendar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update Forex Factory calendar"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push && exit 0
          done
          exit 1
