name: CFTC E-mini COT history
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 5'
permissions:
  contents: write
concurrency:
  group: cot-history-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official CFTC history
        run: python scripts/cot_snapshot.py
      - name: Save updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-market-state/cot-sp500.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update E-mini COT history"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push && exit 0
          done
          exit 1
