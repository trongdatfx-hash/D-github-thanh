name: Trend age label correctness
on:
  push:
    branches: [main]
    paths:
      - 'netflow-stumpy/pre-rth-wlr-trend.mjs'
      - 'netflow-stumpy/tests/pre-rth-wlr-trend.test.mjs'
      - 'netflow-stumpy/studies-core.mjs'
      - 'netflow-stumpy/studies-worker.mjs'
      - 'netflow-stumpy/app.mjs'
      - 'netflow-stumpy/scripts/audit-trend-age.mjs'
      - '.github/workflows/trend-age-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trend age, channel lifecycle and unchanged ABA
        run: node --test netflow-stumpy/tests/pre-rth-wlr-trend.test.mjs netflow-stumpy/tests/causal-trend-channel.test.mjs netflow-stumpy/tests/wlr-aba.test.mjs netflow-stumpy/tests/engine.test.mjs netflow-stumpy/tests/strength-sources.test.mjs
      - name: Replay PRE, RTH and session-end labels from real stored M15 history
        run: node netflow-stumpy/scripts/audit-trend-age.mjs > trend-age-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: trend-age-label-audit
          path: trend-age-audit.json
          retention-days: 30
