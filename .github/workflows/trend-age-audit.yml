name: Matrix trend status correctness
on:
  push:
    branches: [main]
    paths:
      - 'netflow-stumpy/matrix-trend-status.mjs'
      - 'netflow-stumpy/tests/matrix-trend-status.test.mjs'
      - 'netflow-stumpy/tests/matrix-trend-runtime.test.mjs'
      - 'netflow-stumpy/studies-core.mjs'
      - 'netflow-stumpy/studies-worker.mjs'
      - 'netflow-stumpy/app.mjs'
      - 'netflow-stumpy/h1-color-cache.mjs'
      - 'netflow-ml/tests/fixtures/**'
      - '.github/workflows/trend-age-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify matrix states, OI isolation, closed timestamps and H1 preservation
        run: node --test netflow-stumpy/tests/matrix-trend-status.test.mjs netflow-stumpy/tests/matrix-trend-runtime.test.mjs netflow-stumpy/tests/h1-color-cache.test.mjs netflow-stumpy/tests/matrix-geometry.test.mjs netflow-stumpy/tests/causal-trend-channel.test.mjs netflow-stumpy/tests/engine.test.mjs netflow-stumpy/tests/strength-sources.test.mjs netflow-stumpy/tests/spy-session-change.test.mjs
