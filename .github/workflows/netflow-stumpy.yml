name: NetFlow STUMPY Historical Analogs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netflow-stumpy.yml'
      - 'netflow-stumpy/scripts/**'
      - 'netflow-stumpy/analogs-core.mjs'
      - 'netflow-stumpy/analogs-features.mjs'
      - 'netflow-stumpy/requirements-analogs.txt'
      - 'netflow-stumpy/tests/**'
      - 'netflow-stumpy/rth-structure.mjs'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: netflow-stumpy-snapshots
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual STUMPY library
        run: python -m pip install -r netflow-stumpy/requirements-analogs.txt
      - name: Collect closed candles (never substitute fixtures)
        id: collect
        continue-on-error: true
        run: python netflow-stumpy/collect-history.py
      - name: Build causal feature dataset
        run: node netflow-stumpy/scripts/analogs-dataset.mjs
      - name: Compute STUMPY MASS profiles
        run: python netflow-stumpy/scripts/stumpy-profiles.py --input netflow-stumpy/data/analogs/features.json --output netflow-stumpy/data/analogs/profiles.json
      - name: Verify parity and causal selection
        env:
          ANALOG_FEATURES: netflow-stumpy/data/analogs/features.json
          ANALOG_PROFILES: netflow-stumpy/data/analogs/profiles.json
        run: node --test netflow-stumpy/tests/analogs.test.mjs netflow-stumpy/tests/strength-sources.test.mjs
      - name: Publish compact snapshot
        run: node netflow-stumpy/scripts/analogs-dataset.mjs --finalize
      - name: Build PRE-to-POST cases targeting RTH geometry
        run: node netflow-stumpy/scripts/rth-structure-dataset.mjs
      - name: Compute actual STUMPY profiles for RTH snapshots and historical queries
        run: python netflow-stumpy/scripts/stumpy-profiles.py --input netflow-stumpy/data/rth-structure/tasks.json --output netflow-stumpy/data/rth-structure/profiles.json
      - name: Verify RTH causality, NY calendar and MASS parity
        env:
          ANALOG_FEATURES: netflow-stumpy/data/rth-structure/tasks.json
          ANALOG_PROFILES: netflow-stumpy/data/rth-structure/profiles.json
        run: node --test netflow-stumpy/tests/rth-structure.test.mjs netflow-stumpy/tests/analogs.test.mjs
      - name: Publish RTH geometry report
        run: node netflow-stumpy/scripts/rth-structure-dataset.mjs --finalize
      - name: Commit closed history and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netflow-stumpy/data/binance/m15 netflow-stumpy/data/analogs/snapshot.json netflow-stumpy/data/rth-structure/report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh STUMPY historical analogs'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
          done
          exit 1
