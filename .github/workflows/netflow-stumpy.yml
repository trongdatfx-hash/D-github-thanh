name: WLR A-B-A Production Snapshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netflow-stumpy.yml'
      - 'netflow-stumpy/scripts/**'
      - 'netflow-stumpy/collect-history.py'
      - 'netflow-stumpy/wlr-aba-*.mjs'
      - 'netflow-stumpy/analogs-core.mjs'
      - 'netflow-stumpy/analogs-features.mjs'
      - 'netflow-stumpy/engine.mjs'
      - 'netflow-stumpy/requirements-analogs.txt'
      - 'netflow-stumpy/tests/**'
      - 'research/wlr-aba/**'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: netflow-stumpy-snapshots
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual STUMPY library
        run: python -m pip install -r netflow-stumpy/requirements-analogs.txt
      - name: Collect closed candles (never substitute fixtures)
        id: collect
        run: python netflow-stumpy/collect-history.py
      - name: Verify collector fallback and data integrity
        run: python -m unittest discover -s netflow-stumpy/tests -p 'test_*.py'
      - name: Build WLR A-B-A cases including unfinished membership states
        run: node research/wlr-aba/dataset.mjs
      - name: Actual STUMPY profiles for WLR A-B-A
        run: python netflow-stumpy/scripts/stumpy-profiles.py --input research/wlr-aba/output/tasks.json --output research/wlr-aba/output/profiles.json
      - name: Verify causality, live lifecycle, preserved trend age and MASS parity
        env:
          WLR_TASKS: research/wlr-aba/output/tasks.json
          WLR_PROFILES: research/wlr-aba/output/profiles.json
        run: node --test research/wlr-aba/tests.mjs netflow-stumpy/tests/wlr-aba.test.mjs netflow-stumpy/tests/wlr-aba-status.test.mjs netflow-stumpy/tests/wlr-aba-v3.test.mjs netflow-stumpy/tests/wlr-aba-ui.test.mjs netflow-stumpy/tests/engine.test.mjs netflow-stumpy/tests/strength-sources.test.mjs netflow-stumpy/tests/pre-rth-wlr-trend.test.mjs
      - name: Score frozen validation choice and publish compact ABA archive
        run: |
          node research/wlr-aba/dataset.mjs --finalize
          node netflow-stumpy/scripts/publish-wlr-aba.mjs
      - name: Report data freshness and research locks
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('netflow-stumpy/data/wlr-aba/report.json'));
          const c=r.collection;
          console.log('## WLR data and evidence status');
          console.log('- Archive: **'+c.status+'** / '+c.source+'; lag at collection: '+c.lagHours+' hours');
          console.log('- Data through: '+new Date(r.sourceAsOf).toISOString());
          console.log('- Price decision: **'+r.decision+'**; V2: **'+r.v2.status+'**; V3 gate: **'+r.v3.status+'**');
          console.log('- V3 gate: '+r.v3.spec.gateStart+' to '+r.v3.spec.testStart+'; fixed six-week development window');
          console.log('- V3 policy frozen: '+r.v3.policyId+' at '+new Date(r.v3.freeze.createdAt).toISOString());
          console.log('- V3 forward from '+r.v3.spec.forwardStart+'; replay queries: '+r.v3.forward.queries+' (not a prospective live prediction ledger)');
          console.log('- Snapshot: '+r.snapshotId);
          NODE
      - name: Commit closed history and authorized ABA snapshot
        run: python netflow-stumpy/scripts/commit-wlr-snapshot.py
