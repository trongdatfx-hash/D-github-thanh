name: Binance derivatives snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Binance M15 derivatives data
        run: python scripts/binance_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/binance/
          if git diff --cached --quiet; then
            echo "No new Binance data."
          else
            git commit -m "data: update Binance derivatives snapshot"
            git push
          fi
