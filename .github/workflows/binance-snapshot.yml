name: Binance collector manual recovery

on:
  workflow_dispatch:

concurrency:
  group: repository-data-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    if: github.repository == 'trongdatfx-hash/D-github-thanh' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - run: pip install -r ai-engine/requirements.txt
      - name: Recover closed Binance M15 bars and receipt-time observations
        env:
          AI_MARKET_SOURCE: websocket
          BINANCE_REST_BASE: ${{ vars.BINANCE_REST_BASE || 'https://fapi.binance.com' }}
        run: python ai-engine/collect_layers.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-engine/data/layers/*_last.csv ai-engine/data/layers/*_mark.csv ai-engine/data/layers/*_index.csv ai-engine/data/layers/aux_receipts.jsonl ai-engine/data/layers/collection_status.json
          if git diff --cached --quiet; then
            echo "No new Binance data."
          else
            git commit -m "data: update Binance derivatives snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                exit 1
              fi
              git push && exit 0
            done
            exit 1
          fi
      - name: Preserve collector inputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: binance-collector-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ai-engine/data/layers/*_last.csv
            ai-engine/data/layers/*_mark.csv
            ai-engine/data/layers/*_index.csv
            ai-engine/data/layers/*.jsonl
            ai-engine/data/layers/collection_status.json
          retention-days: 7
