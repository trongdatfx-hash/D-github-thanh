name: SPYUSDT.P AI Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai-engine/**/*.py"
      - ".github/workflows/ai-engine.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
concurrency:
  group: spyusdt-ai-engine
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ai-engine/requirements.txt
      - run: |
          cd ai-engine
          python binance_data.py
          python run_mvp.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-engine/data ai-engine/reports ai-engine/models
          git diff --cached --quiet || git commit -m "Update AI signal results"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push && exit 0
          done
          exit 1
