name: Delayed VIX, VIX9D and SP500 quotes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/volatility-quotes.yml'
      - 'scripts/collect-volatility.py'
      - 'scripts/test_collect_volatility.py'
      - 'netflow-stumpy/volatility-quotes*.mjs'
      - 'netflow-stumpy/market-watchlist.mjs'
      - 'netflow-stumpy/oi-spectrum.mjs'
      - 'netflow-stumpy/tests/oi-spectrum.test.mjs'
      - 'netflow-stumpy/tests/volatility-quotes.test.mjs'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: volatility-quotes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify daily OI, independent CVD and delayed quote states
        run: |
          node --check netflow-stumpy/app.mjs
          node --check netflow-stumpy/volatility-quotes-ui.mjs
          node --test netflow-stumpy/tests/oi-spectrum.test.mjs netflow-stumpy/tests/volatility-quotes.test.mjs
          python -m unittest discover -s scripts -p 'test_collect_volatility.py'
      - name: Collect delayed quotes or retain last known timestamps on errors
        run: python scripts/collect-volatility.py
      - name: Publish only quote snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netflow-stumpy/data/volatility.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh delayed VIX, VIX9D and SP500 quotes'
          git pull --rebase origin main
          git push origin HEAD:main
