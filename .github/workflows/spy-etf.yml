name: SPY ETF price snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/spy-etf.yml', 'netflow-stumpy/scripts/collect-spy.py', 'netflow-stumpy/spy-data.mjs', 'netflow-stumpy/app.mjs']
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: spy-etf-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test SPY adapter and original indicators
        run: node --test netflow-stumpy/tests/spy-data.test.mjs netflow-stumpy/tests/engine.test.mjs netflow-stumpy/tests/strength-sources.test.mjs netflow-stumpy/tests/pre-rth-wlr-trend.test.mjs netflow-stumpy/tests/wlr-aba.test.mjs
      - name: Fetch actual ETF candles including extended hours
        run: python netflow-stumpy/scripts/collect-spy.py
      - name: Commit ETF data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netflow-stumpy/data/spy/5m.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh SPY ETF candles'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Wait for existing branch-based Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50" --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$active" = "0" ]; then exit 0; fi
            sleep 5
          done
          echo 'An existing Pages deployment is still running'
          exit 1
      - uses: actions/deploy-pages@v4
