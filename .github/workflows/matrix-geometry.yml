name: Matrix geometry causal checks
on:
  push:
    paths:
      - 'netflow-stumpy/composite-nf-smooth.mjs'
      - 'netflow-stumpy/tests/composite-nf-smooth.test.mjs'
      - 'netflow-stumpy/tests/composite-nf-ui.test.mjs'
      - 'netflow-stumpy/matrix-trend-status.mjs'
      - 'netflow-stumpy/tests/matrix-trend-status.test.mjs'
      - 'netflow-stumpy/tests/matrix-trend-runtime.test.mjs'
      - 'netflow-stumpy/h1-color-cache.mjs'
      - 'netflow-stumpy/matrix-geometry.mjs'
      - 'netflow-stumpy/geometry.mjs'
      - 'netflow-stumpy/studies-core.mjs'
      - 'netflow-stumpy/studies-worker.mjs'
      - 'netflow-stumpy/h1-box-score.mjs'
      - 'netflow-stumpy/h1-box-score-ui.mjs'
      - 'netflow-stumpy/spy-volume-h1-mirror.mjs'
      - 'netflow-stumpy/h1-score-line.mjs'
      - 'netflow-stumpy/wlr-h1-style.mjs'
      - 'netflow-stumpy/wlr-color-segments.mjs'
      - 'netflow-stumpy/tests/wlr-color-segments.test.mjs'
      - 'netflow-stumpy/tests/wlr-h1-style.test.mjs'
      - 'netflow-stumpy/tests/wlr-h1-integration.test.mjs'
      - 'netflow-stumpy/tests/h1-score-line.test.mjs'
      - 'netflow-stumpy/tests/spy-volume-h1-mirror.test.mjs'
      - 'netflow-stumpy/h1-matrix-state.mjs'
      - 'netflow-stumpy/large-taker-spectrum.mjs'
      - 'netflow-stumpy/paired-spectrum.mjs'
      - 'netflow-stumpy/tests/matrix-price-confirmation.test.mjs'
      - 'netflow-stumpy/tests/large-taker-spectrum.test.mjs'
      - 'netflow-stumpy/oi-candle-bars.mjs'
      - 'netflow-stumpy/tests/matrix-geometry.test.mjs'
      - '.github/workflows/matrix-geometry.yml'
  pull_request:
    paths:
      - 'netflow-stumpy/**'
      - '.github/workflows/matrix-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test netflow-stumpy/tests/matrix-trend-status.test.mjs netflow-stumpy/tests/matrix-trend-runtime.test.mjs netflow-stumpy/tests/h1-color-cache.test.mjs netflow-stumpy/tests/composite-nf-smooth.test.mjs netflow-stumpy/tests/composite-nf-ui.test.mjs netflow-stumpy/tests/wlr-h1-style.test.mjs netflow-stumpy/tests/wlr-h1-integration.test.mjs netflow-stumpy/tests/wlr-color-segments.test.mjs netflow-stumpy/tests/matrix-geometry.test.mjs netflow-stumpy/tests/geometry.test.mjs netflow-stumpy/tests/h1-box-score.test.mjs netflow-stumpy/tests/spy-volume-h1-mirror.test.mjs netflow-stumpy/tests/h1-score-line.test.mjs netflow-stumpy/tests/h1-matrix-state.test.mjs netflow-stumpy/tests/matrix-price-confirmation.test.mjs netflow-stumpy/tests/large-taker-spectrum.test.mjs



