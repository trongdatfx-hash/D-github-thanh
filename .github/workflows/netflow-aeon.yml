name: NetFlow aeon V1 research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netflow-aeon.yml'
      - 'netflow-stumpy/scripts/aeon-v1.py'
      - 'netflow-stumpy/requirements-aeon.txt'
  schedule:
    - cron: '37 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: netflow-aeon-v1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r netflow-stumpy/requirements-aeon.txt
      - name: Build closed causal features from existing shared archive
        run: node netflow-stumpy/scripts/analogs-dataset.mjs
      - name: Train, calibrate and run purged chronological evaluation
        run: python netflow-stumpy/scripts/aeon-v1.py --input netflow-stumpy/data/analogs/features.json --output netflow-stumpy/data/aeon/report.json
      - name: Preserve evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: aeon-v1-evaluation
          path: netflow-stumpy/data/aeon/report.json
      - name: Publish research snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netflow-stumpy/data/aeon/report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: aeon V1 purged evaluation and snapshot'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
          done
          exit 1
